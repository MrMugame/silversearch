name: silversearch
functions:
  startSearch:
    path: "./silversearch.ts:startSearch"
    command:
      name: "Silversearch: Search"
      key: Ctrl-s
      mac: Cmd-s
  getVersion:
    path: "./silversearch.ts:showVersion"
    command:
      name: "Silversearch: Version"
  clearHistory:
    path: "./silversearch.ts:clearHistory"
    command:
      name: "Silversearch: Clear History"
  openSearch:
    path: "./silversearch.ts:openSearch"
    syscall: "silversearch.openSearch"
  reindex:
    path: "./silversearch.ts:reindex"
    syscall: "silversearch.reindex"
    command:
      name: "Silversearch: Reindex"
  init:
    path: "./silversearch.ts:init"
    events:
      - "editor:init"
  indexPage:
    path: "./silversearch.ts:indexPage"
    events:
      - "page:index"
  indexDocument:
    path: "./silversearch.ts:indexDocument"
    events:
      - "document:index"
  deleted:
    path: "./silversearch.ts:deleted"
    events:
      - "file:deleted"
  search:
    path: "./silversearch.ts:search"
    syscall: "silversearch.search"